<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pour toi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 42%, #071b36, #020611 55%, #010206);
    color: #e5f4ff;
  }
  main { width: min(100%, 38rem); padding: 1.25rem; text-align: center; }
  button {
    display: block;
    width: min(100%, 28rem);
    margin: auto;
    padding: 0;
    border: 0;
    border-radius: 1rem;
    background: none;
    color: inherit;
    cursor: pointer;
    font: 0.85rem system-ui, sans-serif;
    letter-spacing: 0.12em;
  }
  button:focus-visible { outline: 2px solid #82dfff; outline-offset: 5px; }
  canvas { display: block; width: 100%; aspect-ratio: 1; }
  .hint { display: block; min-height: 1.3em; color: #a8d6f7; }
  button[aria-expanded="true"] .hint { visibility: hidden; }
  .message { min-height: 6.5rem; display: grid; place-items: start center; }
  p {
    margin: 0.75rem auto 0;
    max-width: 24ch;
    font: clamp(1.65rem, 5.7vw, 2.5rem)/1.2 Georgia, serif;
    text-wrap: balance;
    text-shadow: 0 0 24px #388dff;
    animation: reveal 0.85s ease both;
  }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { p { animation: none; } }
</style>
</head>
<body>
<main>
  <button id="heart" aria-label="Toucher le cœur pour découvrir le message" aria-controls="message" aria-expanded="false">
    <canvas aria-hidden="true"></canvas>
    <span class="hint">Touche le cœur</span>
  </button>
  <div class="message" aria-live="polite">
    <p id="message" hidden></p>
  </div>
  <noscript>Tu ne seras jamais seul tant que je serais là</noscript>
</main>
<script>
  const button = document.querySelector('#heart');
  const message = document.querySelector('#message');
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const colors = ['#235cda', '#3493ff', '#67ceff', '#c8f3ff'];
  const particles = Array.from({ length: 1800 }, (_, index) => {
    const angle = Math.random() * Math.PI * 2;
    const scale = index < 380 ? 1 - Math.random() * 0.045 : Math.sqrt(Math.random());
    return {
      x: 16 * Math.sin(angle) ** 3 * scale,
      y: -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle)
        - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale,
      phase: Math.random() * Math.PI * 2,
      size: 0.4 + Math.random() ** 2 * 1.45,
      color: colors[index % colors.length],
      drift: 0.4 + Math.random() * 0.6
    };
  });

  let size = 0;
  let revealedAt = -Infinity;
  const start = performance.now();

  function resize() {
    size = canvas.clientWidth;
    const density = Math.min(2, devicePixelRatio || 1);
    canvas.width = canvas.height = Math.round(size * density);
    ctx.setTransform(density, 0, 0, density, 0, 0);
  }

  function draw(now) {
    const still = reducedMotion.matches;
    const time = still ? 2 : (now - start) / 1000;
    const elapsed = (now - revealedAt) / 1000;
    const burst = !still && elapsed < 1.25 ? Math.sin(Math.PI * elapsed / 1.25) : 0;
    const formation = Math.max(0, 1 - time / 1.65) ** 2;
    const unit = size / 45;
    const beat = 1 + 0.025 * Math.sin(time * 3);

    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(size / 2, size * 0.88);
    ctx.scale(1, 0.19);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.34);
    glow.addColorStop(0, '#79eaffad');
    glow.addColorStop(0.38, '#118dff70');
    glow.addColorStop(1, '#118dff00');
    ctx.fillStyle = glow;
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.restore();

    ctx.globalCompositeOperation = 'lighter';
    for (const point of particles) {
      const swirl = point.phase + time * 0.8;
      const drift = burst * point.drift * size * 0.19;
      const x = size / 2 + point.x * unit * beat * (1 - formation * 0.7)
        + Math.cos(swirl) * (1.4 + drift);
      const y = size * 0.46 + point.y * unit * beat * (1 - formation)
        + size * 0.39 * formation + Math.sin(swirl) * (1.4 + drift);
      ctx.fillStyle = point.color;
      ctx.globalAlpha = 0.24 + 0.64 * (0.5 + 0.5 * Math.sin(point.phase + time * 4));
      ctx.fillRect(x, y, point.size, point.size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }

  button.addEventListener('click', () => {
    revealedAt = performance.now();
    if (message.hidden) {
      message.hidden = false;
      message.textContent = 'Tu ne seras jamais seul tant que je serais là';
      button.setAttribute('aria-expanded', 'true');
      button.setAttribute('aria-label', 'Relancer l’animation du cœur');
    }
  });

  resize();
  new ResizeObserver(resize).observe(canvas);
  requestAnimationFrame(draw);
</script>
</body>
</html>
