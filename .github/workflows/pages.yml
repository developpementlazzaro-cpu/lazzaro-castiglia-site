name: Publier Lazzaro Castiglia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Déployer les sites publics
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Vérifier le site et les 3 activités
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/commerce-ia/index.html
          test -s site/commerce-ia/studio/index.html
          test -s site/commerce-ia/bureau/index.html
          test -s site/commerce-ia/voyage/index.html
          test -s site/commerce-ia/style.css
          python3 - <<'PY'
          from pathlib import Path
          for page in Path('site/commerce-ia').rglob('index.html'):
              data = page.read_text(encoding='utf8')
              assert '<meta name="viewport"' in data, page
              assert '</html>' in data, page
              assert 'mailto:developpementlazzaro@gmail.com' in data or 'index.html' in data, page
          print("Pages commerciales vérifiées")
          PY
      - name: Préparer l'artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
