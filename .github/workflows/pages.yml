name: Publier Lazzaro Castiglia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer les illustrations et les chemins relatifs
        run: |
          node fetch-assets.mjs
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('site').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('href="/', 'href="./').replace('src="/', 'src="./')
              path.write_text(text, encoding='utf-8')
          for path in Path('site').glob('*.css'):
              text = path.read_text(encoding='utf-8')
              text = text.replace("url('/assets/", "url('./assets/").replace('url("/assets/', 'url("./assets/')
              path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
